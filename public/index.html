<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RemindMe</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>RemindMe</h1>
    <div id="session" hidden>
      <span id="connection" class="dot" title="Real-time: offline"></span>
      <span id="whoami"></span>
      <button id="logout" type="button" class="link">Log out</button>
    </div>
  </header>

  <main>
    <section id="auth-view" hidden>
      <p id="auth-message" class="notice" hidden></p>
      <div class="auth-forms">
        <form id="login-form" class="card">
          <h2>Log in</h2>
          <label>Username <input name="username" autocomplete="username" required></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">Log in</button>
        </form>
        <form id="signup-form" class="card">
          <h2>Sign up</h2>
          <label>Username <input name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+"></label>
          <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label>
          <label>Email <small>(optional, for overdue emails)</small> <input name="email" type="email" autocomplete="email"></label>
          <button type="submit">Create account</button>
        </form>
      </div>
    </section>

    <section id="app-view" hidden>
      <form id="task-form" class="card">
        <h2>New task</h2>
        <label>Title <input name="title" required maxlength="200"></label>
        <label>Description <textarea name="description" maxlength="2000" rows="2"></textarea></label>
        <label>Due <input name="dueDate" type="datetime-local" required></label>
        <button type="submit">Add task</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter by status">
          <button type="button" data-filter="" aria-pressed="true">All</button>
          <button type="button" data-filter="pending" aria-pressed="false">Pending</button>
          <button type="button" data-filter="overdue" aria-pressed="false">Overdue</button>
          <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <label>Sort
          <select id="sort">
            <option value="dueDate:asc">Due date (soonest)</option>
            <option value="dueDate:desc">Due date (latest)</option>
            <option value="createdAt:desc">Newest first</option>
          </select>
        </label>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty" class="empty" hidden>No tasks here.</p>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
